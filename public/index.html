<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Build the park</title>
    <link rel="stylesheet" href="/styles.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎡</text></svg>"
    />
  </head>
  <body>
    <!-- The park canvas is injected here by Matter.Render. -->
    <div id="world" aria-hidden="true"></div>

    <header class="hud hud--top">
      <div class="brand">
        <span class="brand__mark" id="club-mark">AI CLUB</span>
        <h1 class="brand__line">Walk around. Build anything.</h1>
      </div>
      <dl class="counters">
        <div><dt>built today</dt><dd id="stat-total">0</dd></div>
        <div><dt>plots used</dt><dd id="stat-plots">0<span class="counters__of">/12</span></dd></div>
      </dl>
    </header>

    <!-- The prompt sits in the middle of the screen, over the plot you are
         standing in. Walk somewhere, type, watch it drop in. -->
    <div class="stage" id="stage">
      <div class="plotcard" id="plotcard">
        <span class="plotcard__num" id="plot-num">PLOT 1</span>
        <span class="plotcard__state" id="plot-state">empty lot</span>
      </div>

      <form class="composer" id="composer" autocomplete="off">
        <input
          id="prompt"
          class="composer__input"
          type="text"
          name="prompt"
          maxlength="140"
          placeholder="a statue of your chemistry teacher"
          aria-label="Describe what to build in this plot"
          spellcheck="false"
        />
        <button class="composer__go" type="submit" id="go">Build it</button>
      </form>

      <!-- Roughly half of booth traffic will not type. These are for them. -->
      <div class="presets" id="presets">
        <button type="button" data-prompt="a giant statue">giant statue</button>
        <button type="button" data-prompt="a ferris wheel">ferris wheel</button>
        <button type="button" data-prompt="a dragon">dragon</button>
        <button type="button" data-prompt="a giant robot">giant robot</button>
        <button type="button" data-prompt="a bouncy castle">bouncy castle</button>
        <button type="button" data-prompt="a rocket ship">rocket ship</button>
      </div>
    </div>

    <footer class="controls" id="controls">
      <span class="controls__group"><kbd>A</kbd><kbd>D</kbd> or <kbd>&larr;</kbd><kbd>&rarr;</kbd> walk</span>
      <span class="controls__group"><kbd>Space</kbd> jump</span>
      <span class="controls__group"><kbd>Enter</kbd> build here</span>
    </footer>

    <div class="pill" id="pill" hidden></div>

    <script src="/vendor/matter.min.js"></script>
    <script type="module" src="/js/main.js"></script>
  </body>
</html>
