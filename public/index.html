<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Build the park</title>
    <link rel="stylesheet" href="/styles.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎢</text></svg>"
    />

    <!--
      three.js and its GLTFLoader are served from node_modules, never a CDN: the
      venue network blocks things and a park that cannot load its renderer is a
      blank screen. The import map is what lets the loader's bare `import
      "three"` resolve with no bundler in the project.
    -->
    <script type="importmap">
      {
        "imports": {
          "three": "/vendor/three/three.module.js",
          "three/addons/": "/vendor/three-addons/"
        }
      }
    </script>
  </head>
  <body>
    <div id="world" aria-hidden="true"></div>
    <!-- Exhibit signs are HTML, positioned each frame over the 3D view. Cheaper
         than text geometry and always crisp on a projector. -->
    <div id="signs" aria-hidden="true"></div>
    <!-- A crosshair is most of what makes first person read as first person. -->
    <div id="crosshair" aria-hidden="true"></div>

    <header class="hud hud--top">
      <div class="brand">
        <span class="brand__mark" id="club-mark">AI CLUB</span>
        <h1 class="brand__line">Walk around. Build anything.</h1>
      </div>
      <dl class="counters">
        <div><dt>built today</dt><dd id="stat-total">0</dd></div>
        <div><dt>plots used</dt><dd id="stat-plots">0<span class="counters__of">/12</span></dd></div>
      </dl>
    </header>

    <div class="stage" id="stage">
      <div class="plotcard" id="plotcard">
        <span class="plotcard__num" id="plot-num">THE ROAD</span>
        <span class="plotcard__state" id="plot-state">walk onto a plot to build</span>
      </div>

      <form class="composer" id="composer" autocomplete="off">
        <input
          id="prompt"
          class="composer__input"
          type="text"
          name="prompt"
          maxlength="140"
          placeholder="a giant purple dragon"
          aria-label="Describe what to build in this plot"
          spellcheck="false"
        />
        <button class="composer__go" type="submit" id="go">Build it</button>
      </form>

      <!-- Roughly half of booth traffic will not type. These are for them. -->
      <div class="presets" id="presets">
        <button type="button" data-prompt="a giant purple dragon">purple dragon</button>
        <button type="button" data-prompt="a marble statue">marble statue</button>
        <button type="button" data-prompt="a ferris wheel">ferris wheel</button>
        <button type="button" data-prompt="a giant robot">giant robot</button>
        <button type="button" data-prompt="a bouncy castle made of jello">jello castle</button>
        <button type="button" data-prompt="a rocket">rocket</button>
      </div>
    </div>

    <footer class="controls" id="controls">
      <span class="controls__group"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> walk</span>
      <span class="controls__group"><kbd>Shift</kbd> run</span>
      <span class="controls__group"><kbd>Space</kbd> jump</span>
      <span class="controls__group">click or drag to look</span>
      <span class="controls__group"><kbd>V</kbd> <span id="view-mode">first person</span></span>
      <span class="controls__group"><kbd>Enter</kbd> build here</span>
    </footer>

    <div class="pill" id="pill" hidden></div>

    <script type="module" src="/js/main.js"></script>
  </body>
</html>
